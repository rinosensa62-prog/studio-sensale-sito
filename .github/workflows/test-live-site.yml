name: Verifica con browser reale notizie sul sito
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_live_site.cjs'
      - '.github/workflows/test-live-site.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Testa homepage e tutte le sette categorie in produzione
        run: node scripts/check_live_site.cjs
