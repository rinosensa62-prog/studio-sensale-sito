name: Monitoraggio spunti dalle testate specialistiche
on:
  schedule:
    # Mattina e sera: ammette nel sito solo pagine complete gratuite.
    - cron: '45 8,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/monitor_fonti_specialistiche.py'
      - 'scripts/verifica_accesso_gratuito.py'
      - 'tests/test_monitor_specialistiche.py'
      - '.github/workflows/monitor-fonti-specialistiche.yml'
permissions:
  contents: write
concurrency:
  group: studio-sensale-specialistiche
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa parser e sicurezza
        run: python -m unittest discover -s tests -p 'test_monitor_specialistiche.py' -v
      - name: Raccogli e verifica testo gratuito delle notizie
        run: python scripts/monitor_fonti_specialistiche.py
      - name: Salva solo le variazioni
        shell: bash
        run: |
          if git diff --quiet -- assets/spunti-editoriali.json && ! git ls-files --others --exclude-standard | grep -q '^assets/spunti-editoriali.json$'; then
            echo "Spunti invariati."
            exit 0
          fi
          git config user.name "Studio Sensale Notizie Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spunti-editoriali.json
          git commit -m "Aggiorna spunti editoriali da fonti specialistiche"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflitto archivio: preservo cronologia ed esco."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Impossibile pubblicare dopo tre tentativi."
          exit 1
