name: Aggiornamento quotidiano notizie istituzionali
on:
  push:
    paths:
      - 'scripts/aggiorna_fonti.py'
      - 'tests/test_aggiornamenti.py'
      - '.github/workflows/aggiornamento-fonti.yml'
  schedule:
    # Tre verifiche quotidiane (UTC): mattina, primo pomeriggio e sera.
    # In Italia: 08:20/13:20/18:20 in inverno; 09:20/14:20/19:20 in estate.
    - cron: '20 7,12,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-sensale-feed
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica sicurezza e parser
        run: python -m unittest discover -s tests -v
      - name: Recupera nuovi titoli dalle fonti ufficiali
        run: python scripts/aggiorna_fonti.py
      - name: Salva le novita, solo se cambiate
        shell: bash
        run: |
          if git diff --quiet -- assets/aggiornamenti-ufficiali.json; then
            echo "Nessun aggiornamento da pubblicare."
            exit 0
          fi
          git config user.name "Studio Sensale Notizie Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aggiornamenti-ufficiali.json
          git commit -m "Aggiorna notizie da fonti istituzionali"
          # Nel frattempo altri commit possono aggiornare main: sincronizza
          # con rebase e riprova senza forzare la cronologia del sito.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflitto nell'archivio: nessuna sovrascrittura automatica."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Impossibile pubblicare dopo 3 tentativi."
          exit 1
